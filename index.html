<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    

  </head>
  <body class="bg-gray-600">

    <div x-data="dashboard()" x-init="fetchData()">

    <div>
        <div class="bg-gray-100 p-2 md:px-48 text-gray-800">
            <h2 class="text-center my-4 text-2xl font-bold">AWS Cost Dashboard</h2>
            <h4 class="text-center my-4 text-lg font-semibold">Real time visibility into your AWS costs</h4>
            <div class="flex flex-col items-center justify-center pb-2">
                <button x-on:click="resetData()" disabled class="hover:cursor-pointer shadow-lg px-4 py-1 bg-blue-800 rounded-lg hover:bg-blue-700 text-white">Refresh</button>
            </div>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 px-4 lg:px-16 mt-4">
            <div class="bg-white pt-6 px-2 pb-0 w-full border-1 shadow-md text-center flex flex-col justify-between">
                <div x-show="loadingCost" class="text-black">Loading data...</div>
                <div x-show="!loadingCost" class="flex justify-center text-xl font-bold">
                    <div class="mr-2">Total Cost</div>
                    <div class="mr-2" x-text="days"></div>
                    <div>$</div>
                    <div x-text="total_cost"></div>
                </div>
                <div x-show="!loadingCost" class="p-6 text-lg font-semibold">
                    <div class="text-center">Last Updated</div>
                    <div x-text="last_updated"></div>
                </div>
            </div>

            
            <div style="height:380px" x-data="{ showFirst: true }"
                        x-init="setInterval(() => showFirst = !showFirst, 5000)"
                        class="bg-white relative w-full overflow-hidden pt-3 px-2 pb-0 w-full border-1 shadow-md">
                <div x-show="loadingServices" class="text-black text-center mt-4">Loading data...</div>
                <div x-show="showFirst && !loadingServices"
                    x-transition:enter="transition transform duration-1000"
                    x-transition:enter-start="-translate-x-full opacity-0"
                    x-transition:enter-end="translate-x-0 opacity-100"
                    x-transition:leave="transition transform duration-1000"
                    x-transition:leave-start="translate-x-0 opacity-100"
                    x-transition:leave-end="translate-x-full opacity-0"
                    class="absolute top-0 left-0 w-full h-full">
                <div id="service-costs"></div>
                </div>
                <!-- Second Element -->
                <div style="height:380px" x-show="!showFirst && !loadingServices"
                    x-transition:enter="transition transform duration-1000"
                    x-transition:enter-start="translate-x-full opacity-0"
                    x-transition:enter-end="translate-x-0 opacity-100"
                    x-transition:leave="transition transform duration-1000"
                    x-transition:leave-start="translate-x-0 opacity-100"
                    x-transition:leave-end="-translate-x-full opacity-0"
                    class="absolute top-0 left-0 w-full h-full p-4">
                    <div class="text-xl font-bold mb-1 text-center">AWS Services(cost per service)</div>
                    <table class="w-full">
                        <thead>
                            <tr>
                                <th class="p-1 border-b border-gray-300">No</th>
                                <th class="p-1 border-b border-gray-300 w-4/5 text-center">Service</th>
                                <th class="p-1 border-b border-gray-300">Cost</th>
                                <th class="p-1 border-b border-gray-300">%</th>
                            </tr>
                        </thead>
                        <tbody>
                        <template x-for="(service,index) in top_services" :key="index">
                            <tr>
                                <td x-text="index+1" class="p-1 border-b border-gray-300 mb-1 text-sm text-center"></td>
                                <td x-text="service" class="w-2/3 p-1 border-b border-gray-300 mb-1 text-sm text-center"></td>
                                <td x-text="'$' + top_costs[index]" class="p-1 border-b border-gray-300 mb-1 mr-1 text-sm text-center font-semibold"></td>
                                <td x-text="top_pct[index]" class="p-1 border-b border-gray-300 mb-1 ml-1 text-sm text-center font-semibold"></td>
                            </tr>
                        </template>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="pt-6 px-2 pb-0 w-full border-1 shadow-md bg-white">
                <div id="line"></div>
            </div>

            <div style="height:380px" x-data="{ showFirst: true }"
                        x-init="setInterval(() => showFirst = !showFirst, 8000)"
                        class="bg-white relative w-full overflow-hidden pt-3 px-2 pb-0 w-full border-1 shadow-md">
                <div x-show="loadingRegional" class="text-black text-center mt-4">Loading data...</div>
                <div x-show="showFirst && !loadingRegional"
                        x-transition:enter="transition transform duration-1000"
                        x-transition:enter-start="-translate-x-full opacity-0"
                        x-transition:enter-end="translate-x-0 opacity-100"
                        x-transition:leave="transition transform duration-1000"
                        x-transition:leave-start="translate-x-0 opacity-100"
                        x-transition:leave-end="translate-x-full opacity-0"
                        class="absolute top-0 left-0 w-full h-full">
                    <div id="regional-costs"></div>
                </div>
                <!-- Second Element -->
                <div style="height:380px;" x-show="!showFirst && !loadingRegional"
                    x-transition:enter="transition transform duration-1000"
                    x-transition:enter-start="translate-x-full opacity-0"
                    x-transition:enter-end="translate-x-0 opacity-100"
                    x-transition:leave="transition transform duration-1000"
                    x-transition:leave-start="translate-x-0 opacity-100"
                    x-transition:leave-end="-translate-x-full opacity-0"
                    class="absolute top-0 left-0 w-full h-full p-4">
                    <div class="text-xl font-bold mb-1 text-center">Regional Costs</div>
                    <table class="w-full h-full">
                        <thead>
                            <tr>
                                <th class="p-1 border-b border-gray-300">No</th>
                                <th class="p-1 border-b border-gray-300 w-4/5">Region</th>
                                <th class="p-1 border-b border-gray-300">Cost</th>
                                <th class="p-1 border-b border-gray-300">%</th>
                            </tr>
                        </thead>
                        <tbody>
                        <template x-for="(region,index) in regions" :key="index">
                            <tr>
                                <td x-text="index+1" class="p-1 border-b border-gray-300 mb-1 text-sm text-center"></td>
                                <td x-text="region" class="w-4/5 p-1 border-b border-gray-300 mb-1 text-sm text-center"></td>
                                <td x-text="'$' + region_costs[index]" class="p-1 border-b border-gray-300 mb-1 text-sm text-center font-semibold"></td>
                                <td x-text="region_pct[index]" class="p-1 border-b border-gray-300 mb-1 text-sm text-center font-semibold"></td>
                            </tr>
                        </template>
                        </tbody>
                    </table>
                </div>
            </div>
            
        </div>
    </div>
    <div id="footer" class="bg-gray-700 text-gray-200 p-8 text-sm text-center mt-4">
        @Copyright Kevin Wilson 2025
    </div>
   
  </div>

  <script>
        function dashboard() {
            // Dummy data arrays to replace AWS API calls
            const dummyCurrent = {
                total_cost: 33.45,
                daily_costs: [5, 4.8, 5.2, 4.5, 4.9, 5.1, 4.8],
                last_updated: new Date().toISOString()
            };
            const dummyWeekly = {
                daily_breakdown: [
                    { date: "2025-08-21", cost: 5 },
                    { date: "2025-08-22", cost: 4.8 },
                    { date: "2025-08-23", cost: 5.2 },
                    { date: "2025-08-24", cost: 4.5 },
                    { date: "2025-08-25", cost: 4.9 },
                    { date: "2025-08-26", cost: 5.1 },
                    { date: "2025-08-27", cost: 4.8 }
                ]
            };
            const dummyServices = [
                { service: "EC2", cost: 12.50, percentage: 35.2 },
                { service: "S3", cost: 8.75, percentage: 23.6 },
                { service: "Lambda", cost: 4.00, percentage: 13.1 },
                { service: "RDS", cost: 9.20, percentage: 28.1 }
            ];
            const dummyRegions = [
                { region: "us-east-1", cost: 15.00 },
                { region: "us-west-2", cost: 10.00 },
                { region: "eu-central-1", cost: 7.45 },
                { region: "ap-southeast-1", cost: 8.00 }
            ];
            return {
                total_cost:'',
                last_updated:'',
                daily_costs:[],
                days:0,
                top_services:[],
                top_costs:[],
                top_pct:[],
                regions:[],
                region_costs:[],
                region_pct:[],
                loadingCost: true,
                loadingServices: true,
                loadingTrends: true,
                loadingRegional: true,
                error: null,
                fetchData() {
                    this.currentCosts();
                    this.weeklyTrends();
                    this.topServices();
                    this.regionalCosts();
                },
                resetData(){
                    this.loadingCost = true;
                    this.loadingServices = true;
                    this.loadingTrends = true;
                    this.loadingRegional = true;
                    this.currentCosts();
                    this.weeklyTrends();
                    this.topServices();
                    this.regionalCosts();
                },
                currentCosts() {
                    this.total_cost = Math.round(dummyCurrent.total_cost * 100) / 100;
                    this.daily_costs = dummyCurrent.daily_costs;
                    this.days = "(" + dummyCurrent.daily_costs.length + " Days)";
                    const date = new Date(dummyCurrent.last_updated);
                    this.last_updated = date.toLocaleString('en-GB', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: false
                    });
                    this.loadingCost = false;
                },
                weeklyTrends() {
                    this.lineChart(dummyWeekly);
                    this.loadingTrends = false;
                },
                topServices() {
                    const title = "AWS Services(cost per service)";
                    const xaxis = dummyServices.map(item => item.service);
                    const yaxis = dummyServices.map(item => Math.round(item.cost * 100) / 100);
                    const pct = dummyServices.map(item => Math.round(item.percentage * 100) / 100);
                    this.top_services = xaxis;
                    this.top_costs = yaxis;
                    this.top_pct = pct;
                    this.barChart("#service-costs", title, yaxis, xaxis);
                    this.loadingServices = false;
                },
                regionalCosts() {
                    const title = "Regional Costs";
                    const xaxis = dummyRegions.map(item => item.region);
                    const yaxis = dummyRegions.map(item => Math.round(item.cost * 100) / 100);
                    this.regions = xaxis;
                    this.region_costs = yaxis;
                    const total = dummyCurrent.total_cost;
                    this.region_pct = [];
                    yaxis.forEach((cost, index) => {
                        const pct = (cost / total) * 100;
                        const rounded = Math.round(pct * 100) / 100;
                        this.region_pct.push(rounded);
                    });
                    this.barChart("#regional-costs", title, yaxis, xaxis);
                    this.loadingRegional = false;
                },
                barChart(divId, title, yaxis, xaxis) {
                    const chartConfig = {
                        series: [
                            {
                                name: title,
                                data: yaxis,
                            },
                        ],
                        chart: {
                            type: "bar",
                            height: 340,
                            toolbar: {
                                show: true,
                            },
                        },
                        title: {
                            text: title,
                            align: 'center',
                            margin: 44,
                            offsetY: 0,
                            style: {
                                fontSize: '20px',
                                fontWeight: 'bold',
                                color: '#333'
                            }
                        },
                        dataLabels: {
                            enabled: false,
                        },
                        colors: ["#020617"],
                        plotOptions: {
                            bar: {
                                columnWidth: "40%",
                                borderRadius: 2,
                            },
                        },
                        xaxis: {
                            axisTicks: {
                                show: false,
                            },
                            axisBorder: {
                                show: false,
                            },
                            labels: {
                                style: {
                                    colors: "#616161",
                                    fontSize: "12px",
                                    fontFamily: "inherit",
                                    fontWeight: 400,
                                },
                            },
                            categories: xaxis,
                        },
                        yaxis: {
                            labels: {
                                formatter: function (value) {
                                    return `$${value.toLocaleString()}`;
                                },
                                style: {
                                    colors: "#616161",
                                    fontSize: "12px",
                                    fontFamily: "inherit",
                                    fontWeight: 400,
                                },
                            },
                        },
                        grid: {
                            show: true,
                            borderColor: "#dddddd",
                            strokeDashArray: 5,
                            xaxis: {
                                lines: {
                                    show: true,
                                },
                            },
                            padding: {
                                top: 5,
                                right: 20,
                            },
                        },
                        fill: {
                            colors:'#000066',
                            opacity: 0.8,
                        },
                        tooltip: {
                            theme: "dark",
                        },
                    };
                    const chart = new ApexCharts(document.querySelector(divId), chartConfig);
                    chart.render();
                },
                lineChart(data) {
                    const dailyBreakdown = data.daily_breakdown;
                    const day = dailyBreakdown.map(item => item.date);
                    const costs = dailyBreakdown.map(item => Math.round(item.cost * 100) / 100);
                    const chartConfig = {
                        series: [
                            {
                                name: "Weekly Trend(Cost)",
                                data: costs,
                            },
                        ],
                        chart: {
                            type: "line",
                            height: 340,
                            toolbar: {
                                show: false,
                            },
                        },
                        title: {
                            text: 'Weekly Trend(Cost)',
                            align: 'center',
                            margin: 10,
                            offsetY: 0,
                            style: {
                                fontSize: '20px',
                                fontWeight: 'bold',
                                color: '#333'
                            }
                        },
                        dataLabels: {
                            enabled: false,
                        },
                        colors: ["#FF5733"],
                        stroke: {
                            width: 2,
                            lineCap: "round",
                            curve: "smooth",
                        },
                        markers: {
                            size: 0,
                        },
                        xaxis: {
                            axisTicks: {
                                show: false,
                            },
                            axisBorder: {
                                show: false,
                            },
                            labels: {
                                style: {
                                    colors: "#616161",
                                    fontSize: "12px",
                                    fontFamily: "inherit",
                                    fontWeight: 600,
                                },
                            },
                            categories: day,
                        },
                        yaxis: {
                            labels: {
                                formatter: function (value) {
                                    return `$${value.toLocaleString()}`;
                                },
                                style: {
                                    colors: "#616161",
                                    fontSize: "12px",
                                    fontFamily: "inherit",
                                    fontWeight: 600,
                                },
                            },
                        },
                        grid: {
                            show: true,
                            borderColor: "#dddddd",
                            strokeDashArray: 5,
                            xaxis: {
                                lines: {
                                    show: true,
                                },
                            },
                            padding: {
                                top: 5,
                                right: 20,
                            },
                        },
                        fill: {
                            colors: ['#000099'],
                            opacity: 0.8,
                        },
                        tooltip: {
                            theme: "dark",
                        },
                    };
                    const chart = new ApexCharts(document.querySelector("#line"), chartConfig);
                    chart.render();
                }
            }
        }
  </script>


  </body>
</html>
